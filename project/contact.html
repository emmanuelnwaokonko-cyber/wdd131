<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Everwith Goods and Services">
    <meta name="author" content="Emmanuel Nwaokonko">
    <title>Everwith Goods and Services</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/style-large.css">
    <script src="scripts/main.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <div class="header-container">
        <img src="images/logo.png" alt="Everwith Logo" class="logo">

        <div>
            <h1>Everwith Goods and Services</h1>
            <p>Reliable Procurement and Supply Solutions</p>
             <button id="theme-btn">Dark Mode</button>
        </div>
    </div>
    <button id="menu-btn">&#9776;</button>
    <nav>
        <ul class="navigation">
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="page-banner">
        <h2>Contact Us</h2>
    </section>

    <section class="contact-container">

        <div class="contact-info">
            <h3>Get In Touch</h3>

            <p>Email: everwith001@gmail.com</p>
            <p>Phone: +2348067452072</p>
            <p>Address: 58 St Micheals Road, Aba, Nigeria</p>
        </div>

        <form class="contact-form">

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>
            <p id="email-msg"></p>
            <label for="message">Message</label>
            <textarea id="message" rows="6"></textarea>

            <input type="submit" value="Send Message">
        </form>

    </section>

</main>

<footer>
    <p>
         &copy;<span id="currentyear"></span> | Emmanuel Nwaokonko | Nigeria
    </p>
    <p id="lastModified"></p>
    <p>
         <a href="siteplan.html" class="footer-link">Reference Page</a>
    </p>
</footer>

</body>
</html>
