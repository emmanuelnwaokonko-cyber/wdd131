<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="WDD 131 Dynamic Web Fundamentals by Emmanuel Nwaokonko. Featuring a form (product review) that has services and ratings.">
        <meta name="author" content="Emmanuel Nwaokonko">
        <link rel="stylesheet" href="styles/form.css">
        <script src="scripts/form.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
     <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <div class="form-group">
                <label for="productName">Product Name *</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="rating-group">
                <legend>Overall Rating *</legend>

                <div class="rating-options">
                    <div>
                        <label for="star1">☆</label>
                        <input type="radio" id="star1" name="rating" value="1" required>
                    </div>

                    <div>
                        <label for="star2">☆☆</label>
                        <input type="radio" id="star2" name="rating" value="2" required>
                    </div>

                    <div>
                        <label for="star3">☆☆☆</label>
                        <input type="radio" id="star3" name="rating" value="3" required>
                    </div>

                    <div>
                        <label for="star4">☆☆☆☆</label>
                        <input type="radio" id="star4" name="rating" value="4" required>
                    </div>

                    <div>
                        <label for="star5">☆☆☆☆☆</label>
                        <input type="radio" id="star5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="installDate">Date of Installation *</label>
                <input
                    type="date"
                    id="installDate"
                    name="installDate"
                    required>
            </div>
            <fieldset>
                <legend>
                    Which features did you find useful in the product?
                    <br>
                    <em>(Check all that apply)</em>
                </legend>

                <label for="durability">
                    <input type="checkbox"
                           id="durability"
                           name="features"
                           value="Durability">
                    Durability
                </label>

                <label for="easeOfUse">
                    <input type="checkbox"
                           id="easeOfUse"
                           name="features"
                           value="Ease of Use">
                    Ease of Use
                </label>

                <label for="performance">
                    <input type="checkbox"
                           id="performance"
                           name="features"
                           value="Performance">
                    Performance
                </label>

                <label for="design">
                    <input type="checkbox"
                           id="design"
                           name="features"
                           value="Design">
                    Design
                </label>
            </fieldset>
            <div class="form-group">
                <label for="review">
                    Written Review
                    <span class="optional">(Optional)</span>
                </label>
                <textarea
                    id="review"
                    name="review"
                    rows="6"></textarea>
            </div>
            <div class="form-group">
                <label for="userName">
                    Your Name
                    <span class="optional">(Optional)</span>
                </label>
                <input
                    type="text"
                    id="userName"
                    name="userName">
            </div>
            <input
                type="submit"
                value="Post Review">

        </form>
    </main>

    <footer>
        <p>
            &copy;<span id="currentyear"></span> 🌺 Emmanuel N 🌺 Nigeria
        </p>
        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
